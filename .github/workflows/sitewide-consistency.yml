name: Sitewide footer and disclosure refresh

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/sitewide-footer-disclosure-events-nov26
    paths:
      - scripts/sitewide-consistency.py
      - .github/workflows/sitewide-consistency.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the approved working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove any previously committed generated Pages output
        run: git rm -r --ignore-unmatch _site
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Standardize all HTML pages
        run: python3 scripts/sitewide-consistency.py
      - name: Run required SEO audit
        run: python3 scripts/seo-audit.py
      - name: Check for whitespace errors
        run: git diff --check
      - name: Build GitHub Pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Remove temporary Pages build output
        run: rm -rf _site
      - name: Commit sitewide HTML updates to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep the generated Jekyll output out of the source repository.
          git rm -r --ignore-unmatch _site
          git add -A -- '*.html'
          if git diff --cached --quiet; then
            echo "All HTML pages already match the approved template."
          else
            git commit -m "Standardize footer and disclosure across all HTML pages"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
